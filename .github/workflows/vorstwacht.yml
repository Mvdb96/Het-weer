name: Het weer – meldingen

on:
  schedule:
    # Elk kwartier (tijden in UTC). Het script verstuurt alleen wat aan de beurt is,
    # en elke melding maar één keer (bijgehouden in status.json).
    - cron: "4,19,34,49 * * * *"
  workflow_dispatch:
    inputs:
      actie:
        description: "Wat wil je doen?"
        type: choice
        default: nu
        options:
          - nu
          - test
          - fiets
          - krab

permissions:
  contents: write

concurrency:
  group: meldingen
  cancel-in-progress: false

jobs:
  controle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Meldingen controleren
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python vorstwacht.py --${{ inputs.actie }}
          else
            python vorstwacht.py
          fi
      - name: Status bewaren
        if: always()
        run: |
          if [ -n "$(git status --porcelain status.json)" ]; then
            git config user.name "het-weer"
            git config user.email "het-weer@users.noreply.github.com"
            git add status.json
            git commit -m "Status bijgewerkt"
            for i in 1 2 3; do
              git pull --rebase -X theirs && git push && break
              sleep 5
            done
          fi
